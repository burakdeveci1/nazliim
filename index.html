<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazlım için... ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a001a, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Ana Kart Tasarımı */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(231, 76, 60, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 500px;
            z-index: 10;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ff4d6d;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 150px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            z-index: 99;
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
        }

        /* Sonuç Ekranı ve Söz */
        .result-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            width: 80%;
        }

        .love-message {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.6;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px #ff4d6d;
            animation: fadeIn 2s ease-in-out forwards;
        }

        /* Havai Fişek Canvası */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container" id="gameBox">
        <h1>jınıkım tu bi min bawer dikî?</h1>
        <div class="buttons">
            <button id="yesBtn">EVET</button>
            <button id="noBtn">HAYIR</button>
        </div>
    </div>

    <div class="result-screen" id="resultBox">
        <p class="love-message">
            "Sana olan güvenimi boşa çıkaracak hiçbir patika yok bu hayatta Nazlım. <br>
            Sen benim gökyüzümsün, soluğumsun. <br>
            Seni her şeyden çok seviyorum..."
        </p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const gameBox = document.getElementById('gameBox');
        const resultBox = document.getElementById('resultBox');
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let yesScale = 1;
        let yesFontSize = 1.2;
        let paddingX = 30;
        let paddingY = 12;

        // Ekran boyutlandırma
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // HAYIR butonuna basıldıkça EVET'i büyütme
        noBtn.addEventListener('click', () => {
            yesScale += 0.4; 
            yesFontSize += 0.3;
            paddingX += 10;
            paddingY += 4;

            yesBtn.style.transform = `scale(${yesScale})`;
            yesBtn.style.fontSize = `${yesFontSize}rem`;
            yesBtn.style.padding = `${paddingY}px ${paddingX}px`;
            
            // Hayır butonunu hafifçe sarsalım
            noBtn.style.transform = 'scale(0.95)';
            setTimeout(() => noBtn.style.transform = 'scale(1)', 100);
        });

        // EVET butonuna basıldığında
        yesBtn.addEventListener('click', () => {
            gameBox.style.display = 'none';
            resultBox.style.display = 'block';
            startFireworks();
        });

        // --- 3D Görünümlü Havai Fişek ve İsim Efekti Sistemi ---
        let particles = [];
        let textParticles = [];
        let animationFrame;

        class Particle {
            constructor(x, y, color, angle, speed, size, gravity, friction) {
                this.x = x;
                this.y = y;
                // 3D derinlik hissi için z ekseni simülasyonu
                this.z = Math.random() * 2 + 0.5; 
                this.color = color;
                this.angle = angle;
                this.speed = speed;
                this.size = size * this.z;
                this.gravity = gravity * this.z;
                this.friction = friction;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed * this.z;
                this.y += Math.sin(this.angle) * this.speed * this.z + this.gravity;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10 * this.z;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Havai fişek patlama renkleri
        const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#fff', '#00f5d4', '#7b2cbf'];

        function createFirework(x, y) {
            const particleCount = 60;
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.5;
                const speed = Math.random() * 5 + 3;
                particles.push(new Particle(x, y, color, angle, speed, 3, 0.05, 0.98));
            }
        }

        // Merkezde "Burak ❤️ Nazlı" Yazı Parçacıklarını Oluşturma
        function createTextFirework() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 120; // Sözün üstünde kalması için

            ctx.font = "bold 40px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("Burak ❤️ Nazlı", centerX, centerY);

            // Yazının piksellerini alıp parçacığa dönüştürüyoruz
            const imgData = ctx.getImageData(centerX - 200, centerY - 50, 400, 100);
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Geçici yazıyı sil

            for (let y = 0; y < imgData.height; y += 3) {
                for (let x = 0; x < imgData.width; x += 3) {
                    const index = (y * imgData.width + x) * 4;
                    if (imgData.data[index + 3] > 128) { // Opak pikseller
                        const pX = (centerX - 200) + x;
                        const pY = (centerY - 50) + y;
                        
                        // Yazı parçacıkları dışa doğru hafifçe patlasın
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 1.5;
                        
                        // Neon pembe/kırmızı ağırlıklı isimler
                        const color = Math.random() > 0.3 ? '#ff1e56' : '#fff';
                        
                        textParticles.push(new Particle(pX, pY, color, angle, speed, 2, 0.01, 0.99));
                    }
                }
            }
        }

        function startFireworks() {
            // İlk olarak isim patlamasını yap
            createTextFirework();

            // Sürekli rastgele havai fişekler üret
            setInterval(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.6); // Ekranın üst kısmında patlasınlar
                createFirework(x, y);
            }, 500);

            // Belirli aralıklarla ismi tekrar patlat ki ekranda yenilensin
            setInterval(() => {
                createTextFirework();
            }, 4000);

            function animate() {
                // Siyah arka planı hafif opak temizle (kuyruk efekti için)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Normal havai fişekler
                particles = particles.filter(p => p.alpha > 0);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                // İsim havai fişeği
                textParticles = textParticles.filter(p => p.alpha > 0);
                textParticles.forEach(p => {
                    p.update();
                    p.draw();
                });

                animationFrame = requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
